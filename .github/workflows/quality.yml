name: Quality and Supply Chain

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, coverage, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Compile sources
        run: python -m compileall -q note_maker scripts tests
      - name: Lint new supported surface
        run: python -m ruff check note_maker tests/test_configuration.py tests/test_unified_cli.py
      - name: Check formatting
        run: python -m ruff format --check note_maker tests/test_configuration.py tests/test_unified_cli.py
      - name: Type-check unified package
        run: python -m mypy note_maker
      - name: Run tests with coverage floor
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip install --no-deps --force-reinstall dist/*.whl
          note-maker --version

  supply-chain:
    name: Locks, versions, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned audit tooling
        run: python -m pip install -r requirements-dev.lock
      - name: Verify dependency locks are current
        run: |
          python -m piptools compile pyproject.toml --resolver backtracking --strip-extras --output-file /tmp/requirements.lock
          python -m piptools compile pyproject.toml --extra dev --resolver backtracking --strip-extras --output-file /tmp/requirements-dev.lock
          sed '/^#    pip-compile /d' requirements.lock > /tmp/expected-runtime.lock
          sed '/^#    pip-compile /d' /tmp/requirements.lock > /tmp/actual-runtime.lock
          sed '/^#    pip-compile /d' requirements-dev.lock > /tmp/expected-dev.lock
          sed '/^#    pip-compile /d' /tmp/requirements-dev.lock > /tmp/actual-dev.lock
          diff -u /tmp/expected-runtime.lock /tmp/actual-runtime.lock
          diff -u /tmp/expected-dev.lock /tmp/actual-dev.lock
      - name: Verify version synchronization
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          version = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          package = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))["version"]
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          assert version == package == project, (version, package, project)
          print(f"Version synchronized: {version}")
          PY
      - name: Audit pinned runtime dependencies
        run: python -m pip_audit -r requirements.lock --progress-spinner off
