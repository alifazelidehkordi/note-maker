name: P1 Format

on:
  push:
    branches:
      - agent/p1-foundation
    paths:
      - .github/workflows/p1-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical formatting
        run: |
          python -m pip install -r requirements-dev.lock
          python -m ruff format note_maker tests/test_configuration.py tests/test_unified_cli.py
      - name: Commit formatting from the latest branch head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add note_maker tests/test_configuration.py tests/test_unified_cli.py
          git diff --cached --quiet || git commit -m "Format unified configuration and CLI"
          git push origin HEAD:agent/p1-foundation
