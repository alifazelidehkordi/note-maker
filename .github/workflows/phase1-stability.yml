name: Final Conversion Traceback

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Clone branch quietly
        shell: pwsh
        run: git clone --quiet --depth 1 --branch fix/windows-test-stability "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
      - name: Install dependencies quietly
        shell: pwsh
        run: py -3.12 -m pip install -q -r requirements.txt
      - name: Run failing conversion test
        shell: pwsh
        run: py -3.12 -m unittest tests.test_convert_md_to_pdf.ConvertMdToPdfTests.test_batch_convert_reports_partial_failures_and_continues -v
