name: Apply Windows Test Repairs

on:
  push:
    branches:
      - fix/windows-test-stability
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-test-stability
          fetch-depth: 0
      - name: Apply cross-platform repairs and restore CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Expected source block not found in {path}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/batch_common.py",
              '''def _fsync_file(path: Path) -> None:
              with path.open("rb") as handle:
                  os.fsync(handle.fileno())
          ''',
              '''def _fsync_file(path: Path) -> None:
              # Windows requires a writable CRT descriptor for fsync. Opening the
              # completed candidate read/write preserves its contents while making
              # the durability barrier portable across POSIX and Windows.
              with path.open("r+b") as handle:
                  handle.flush()
                  os.fsync(handle.fileno())
          ''',
          )

