name: Phase 1 Stability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    name: Windows traceback — ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - test_atomic_artifact_save.py
          - test_combined_pdf_links.py
          - test_convert_md_to_pdf.py
          - test_fake_browser_provider.py
          - test_job_claims.py
          - test_phase1_acceptance.py
          - test_process_hygiene.py
          - test_profile_manager.py
    runs-on: windows-latest
    steps:
      - name: Clone diagnostic branch
        shell: pwsh
        run: git clone --quiet --depth 1 --branch fix/windows-test-stability "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
      - name: Install dependencies quietly
        shell: pwsh
        run: py -3.12 -m pip install -q -r requirements.txt
      - name: Run isolated module
        shell: pwsh
        env:
          TEST_MODULE: ${{ matrix.module }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = 'module.log'
          cmd.exe /d /s /c "py -3.12 -m unittest discover -s tests -p $env:TEST_MODULE -v > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content $log
          exit $code
