name: Phase 1 Stability

on:
  push:
  pull_request:

jobs:
  diagnose:
    name: Windows diagnostic (Python 3.12)
    runs-on: windows-latest
    outputs:
      summary: ${{ steps.tests.outputs.summary }}
      exit_code: ${{ steps.tests.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - id: tests
        name: Run and summarize test suite
        run: python scripts/run_ci_unittests.py

  report:
    needs: diagnose
    if: always()
    name: Windows failures — ${{ needs.diagnose.outputs.summary }}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve original test result
        env:
          EXIT_CODE: ${{ needs.diagnose.outputs.exit_code }}
          SUMMARY: ${{ needs.diagnose.outputs.summary }}
        run: |
          echo "$SUMMARY"
          test "$EXIT_CODE" = "0"
