name: Phase 1 Stability

on:
  push:
  pull_request:

jobs:
  tests:
    name: Windows diagnostic (Python 3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Run test suite
        run: python scripts/run_ci_unittests.py
      - name: Upload unit-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unit-test-output
          path: logs/unit-test-output.txt
