name: Apply Windows Test Repairs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-test-stability
          fetch-depth: 0
      - name: Apply repairs
        run: python scripts/apply_windows_repair.py
      - name: Commit clean repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make filesystem and process checks Windows-safe"
          git push origin HEAD:fix/windows-test-stability
