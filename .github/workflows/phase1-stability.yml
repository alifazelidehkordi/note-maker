name: Final PDF Test Failure Isolation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Clone branch quietly
        shell: pwsh
        run: git clone --quiet --depth 1 --branch fix/windows-test-stability "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
      - name: Install dependencies quietly
        shell: pwsh
        run: py -3.12 -m pip install -q -r requirements.txt
      - name: Run affected PDF modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = $false
          foreach ($file in @('test_combined_pdf_links.py','test_convert_md_to_pdf.py')) {
            cmd.exe /d /s /c "py -3.12 -m unittest discover -s tests -p $file -v > module.log 2>&1"
            $code = $LASTEXITCODE
            Write-Host "===== $file ====="
            Get-Content module.log
            if ($code -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
