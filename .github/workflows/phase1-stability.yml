name: Phase 1 Stability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  list-tests:
    name: List Windows test modules
    runs-on: windows-latest
    steps:
      - name: Clone diagnostic branch
        shell: pwsh
        run: git clone --quiet --depth 1 --branch fix/windows-test-stability "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
      - name: List test modules
        shell: pwsh
        run: Get-ChildItem tests -Filter 'test_*.py' | Sort-Object Name | ForEach-Object { $_.Name }
