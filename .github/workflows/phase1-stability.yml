name: Phase 1 Stability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    name: Minimal Windows diagnostic
    runs-on: windows-latest
    steps:
      - name: Clone diagnostic branch
        shell: pwsh
        run: git clone --quiet --depth 1 --branch fix/windows-test-stability "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
      - name: Install dependencies quietly
        shell: pwsh
        run: py -3.12 -m pip install -q -r requirements.txt
      - name: Compile sources
        shell: pwsh
        run: py -3.12 -m compileall -q scripts tests
      - name: Run diagnostic wrapper
        shell: pwsh
        run: py -3.12 scripts/run_ci_unittests.py
