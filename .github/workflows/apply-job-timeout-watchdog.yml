name: Apply job timeout watchdog

on:
  push:
    branches:
      - agent/job-timeout-watchdog

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix: add coordinator job timeout watchdog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/job-timeout-watchdog
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply watchdog patch
        run: |
          git apply --check automation/job-timeout-watchdog.patch
          git apply automation/job-timeout-watchdog.patch
          rm automation/job-timeout-watchdog.patch
          rm .github/workflows/apply-job-timeout-watchdog.yml

      - name: Validate watchdog changes
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_job_timeout_watchdog.py' -v

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/parallel_runtime/models.py scripts/parallel_runtime/coordinator.py tests/test_job_timeout_watchdog.py automation/job-timeout-watchdog.patch .github/workflows/apply-job-timeout-watchdog.yml
          git commit -m "fix: add coordinator job timeout watchdog"
          git push origin HEAD:agent/job-timeout-watchdog
