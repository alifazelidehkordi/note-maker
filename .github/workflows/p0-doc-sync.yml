name: P0 Documentation Sync

on:
  push:
    branches:
      - agent/fix-chatgpt-download-runtime
    paths:
      - .github/workflows/p0-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-chatgpt-download-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply documentation updates
        run: python scripts/p0_doc_sync.py
      - name: Commit synchronized documentation
        run: |
          if git diff --quiet -- README.md CHANGELOG.md; then
            echo "Documentation is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git commit -m "Sync 0.8.2 release documentation"
          git push origin HEAD:agent/fix-chatgpt-download-runtime
