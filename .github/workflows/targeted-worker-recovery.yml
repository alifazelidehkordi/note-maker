name: Targeted worker recovery

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-worker-recovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run frozen-worker recovery test repeatedly
        env:
          PYTHONPATH: tests
        run: |
          for attempt in $(seq 1 10); do
            echo "Attempt ${attempt}/10"
            python -m unittest test_parallel_coordinator.ParallelCoordinatorTests.test_heartbeat_timeout_kills_and_replaces_frozen_worker -v
          done
