name: Targeted worker recovery

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-worker-recovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run frozen-worker recovery test repeatedly
        env:
          PYTHONPATH: tests
        run: |
          for attempt in $(seq 1 10); do
            echo "Attempt ${attempt}/10"
            python -m unittest test_parallel_coordinator.ParallelCoordinatorTests.test_heartbeat_timeout_kills_and_replaces_frozen_worker -v
          done

  full-suite-diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full suite and capture failure
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > full-suite.log 2>&1
          status=$?
          tail -n 220 full-suite.log > failure-summary.txt
          echo "$status" > test-exit-status.txt
          exit 0
      - name: Upload full-suite diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-diagnostic-${{ matrix.python-version }}
          path: |
            failure-summary.txt
            test-exit-status.txt
          if-no-files-found: error
      - name: Fail if tests failed
        shell: bash
        run: test "$(cat test-exit-status.txt)" -eq 0
