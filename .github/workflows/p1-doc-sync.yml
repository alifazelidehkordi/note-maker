name: P1 Documentation Sync

on:
  push:
    branches:
      - agent/p1-foundation
    paths:
      - .github/workflows/p1-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-foundation
      - name: Update README and changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              "[![Version](https://img.shields.io/badge/version-0.8.2-2563eb)](CHANGELOG.md)",
              "[![Version](https://img.shields.io/badge/version-0.9.0-2563eb)](CHANGELOG.md)",
              1,
          )
          readme = readme.replace(
              "- [Release checklist](RELEASE_CHECKLIST.md)\n- [Changelog](CHANGELOG.md)",
              "- [Unified configuration and CLI](docs/configuration.md)\n- [Release checklist](RELEASE_CHECKLIST.md)\n- [Changelog](CHANGELOG.md)",
              1,
          )
          readme = readme.replace(
              "- **Batch processing** for PDF, DOCX, and Markdown section workflows",
              "- **Unified `note-maker` CLI** with TOML profiles, environment overrides, dry runs, diagnostics, status, and validation\n- **Pinned runtime and development locks** with automated freshness and vulnerability checks\n- **Batch processing** for PDF, DOCX, and Markdown section workflows",
              1,
          )
          readme = readme.replace(
              "./setup.sh\n```",
              "./setup.sh\n. .venv-linux/bin/activate\nnote-maker doctor\n```",
              1,
          )
          readme = readme.replace(
              "Generated Markdown files are written to `outputs/notes/`.",
              "Generated Markdown files are written to `outputs/notes/`. The same batch runtime is available through the unified CLI:\n\n```bash\nnote-maker run pdf \\\n  --input-dir inputs \\\n  --output-dir outputs/notes \\\n  --output-ext md \\\n  --browser-provider patchright \\\n  --profile-snapshot default\n```\n\nCopy `note-maker.example.toml` to `note-maker.toml` to save reusable settings and named profiles. Inspect the resolved values safely with `note-maker run pdf --dry-run`.",
              1,
          )
          readme = readme.replace(
              "Python packages are installed from `requirements.txt`, including Selenium, Patchright, WeasyPrint, pypdf, Markdown, PyYAML, PyAutoGUI, and clipboard helpers.",
              "Python packages are installed from the exact `requirements.lock` through `requirements.txt`. Development and CI tools use `requirements-dev.lock`; project metadata and supported ranges live in `pyproject.toml`.",
              1,
          )
          readme_path.write_text(readme, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "All notable changes to Note Maker are documented here.\n"
          entry = """

## [0.9.0] — 2026-07-29

### Added

- Installable `note-maker` command with `doctor`, `status`, `validate`, `config`, `run pdf`, and `run markdown` commands.
- Layered TOML configuration with command tables, named profiles, `NOTE_MAKER_*` environment overrides, explicit CLI precedence, and browser-free dry-run inspection.
- Exact runtime and development dependency locks generated from `pyproject.toml`.
- Ruff formatting/linting, strict mypy checks for the supported package surface, a coverage floor, wheel build/install verification, version consistency checks, and pinned dependency auditing.
- CODEOWNERS, Dependabot configuration, a pull-request quality template, and unified configuration documentation.

### Changed

- `requirements.txt` now installs the exact runtime lock instead of resolving loosely bounded dependencies on every setup.
- The unified command delegates to the existing browser, Manifest, Resume, retry, worker, and artifact-validation implementations rather than creating a second runtime.
- Contributor setup and release governance now use reproducible development dependencies and explicit quality gates.

### Compatibility

- Existing shell launchers and direct Python modules remain supported.
- Selenium remains the default provider; Patchright remains opt-in unless selected by configuration.

### Verification

- Cross-platform tests cover Ubuntu and Windows with Python 3.10 and 3.12.
- Browser-free release acceptance remains required.
- Dependency-lock freshness, package metadata, build artifacts, coverage, and vulnerability audit are enforced in CI.
"""
          if "## [0.9.0]" not in changelog:
              changelog = changelog.replace(marker, marker + entry, 1)
          changelog_path.write_text(changelog, encoding="utf-8")
          PY
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git diff --cached --quiet || git commit -m "Document the 0.9.0 P1 foundation"
          git push origin HEAD:agent/p1-foundation
