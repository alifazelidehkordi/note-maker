name: P1 Typing Fix

on:
  push:
    branches:
      - agent/p1-foundation
    paths:
      - .github/workflows/p1-typing-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-foundation
      - name: Annotate intentional legacy import boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("note_maker/cli.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "    from artifact_validation import validate_artifact\n":
                  "    from artifact_validation import validate_artifact  # type: ignore[import-not-found]\n",
              "        import batch_pdf\n":
                  "        import batch_pdf  # type: ignore[import-not-found]\n",
              "        return batch_pdf.run_batch(\n":
                  "        return batch_pdf.run_batch(  # type: ignore[no-any-return]\n",
              "    import batch_markdown\n":
                  "    import batch_markdown  # type: ignore[import-not-found]\n",
              "    return batch_markdown.run_batch(\n":
                  "    return batch_markdown.run_batch(  # type: ignore[no-any-return]\n",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected source pattern missing: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify and commit from the latest branch head
        run: |
          python -m pip install -r requirements-dev.lock
          python -m ruff check note_maker
          python -m ruff format --check note_maker
          python -m mypy note_maker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add note_maker/cli.py
          git diff --cached --quiet || git commit -m "Type the unified legacy bridge"
          git push origin HEAD:agent/p1-foundation
